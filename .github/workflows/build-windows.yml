name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: project-checkin-dashboard-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
